[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
canter-protocol = { path = "crates/canter-protocol" }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util", "process", "signal"] }
axum = "=0.8.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
# serde(other) affects Rust decoding only; ts-rs safely ignores that attribute.
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
thiserror = "=2.0.21"
tempfile = "=3.27.0"
tokio-util = "=0.7.20"
futures-util = "=0.3.34"
async-stream = "=0.3.6"
eventsource-stream = "=0.2.3"
httpdate = "=1.0.3"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
unicode-width = "=0.2.2"
async-trait = "=0.1.92"
similar = "=2.7.0"
ignore = "=0.4.33"
nix = { version = "=0.31.3", features = ["signal", "process"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
terminal-colorsaurus = { version = "=1.0.3", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-onig", "plist-load"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-onig"] }
arboard = { version = "=3.7.0", default-features = false }
