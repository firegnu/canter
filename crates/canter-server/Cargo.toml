[package]
name = "canter-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
canter-core = { path = "../canter-core" }
canter-tools = { path = "../canter-tools" }
canter-model = { path = "../canter-model" }
canter-store = { path = "../canter-store" }
canter-protocol.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "=0.1.20"
thiserror.workspace = true
tempfile.workspace = true
async-stream.workspace = true
futures-util.workspace = true
nix.workspace = true
chrono.workspace = true
plist = "=1.10.1"
base64 = "=0.23.1"
ring = "=0.17.14"
uuid = { version = "=1.26.1", features = ["v4"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }

[dev-dependencies]
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["fmt"] }
eventsource-stream.workspace = true
tokio = { workspace = true, features = ["test-util"] }
