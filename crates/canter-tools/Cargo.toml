[package]
name = "canter-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "=0.23.1"
canter-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonschema = { version = "=0.60.2", default-features = false, features = ["idna"] }
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
async-trait.workspace = true
similar.workspace = true
tempfile.workspace = true
sha2 = "=0.10.9"
nix.workspace = true
reqwest.workspace = true
htmd = "=0.5.6"
encoding_rs = "=0.8.42"
regex-automata = "=0.4.18"
globset = "=0.4.20"
rmcp = { version = "=3.7.0", default-features = false, features = ["auth", "client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
futures-util.workspace = true
sse-stream = "=0.2.6"
notify = "=8.2.1"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
ast-grep-core = { version = "=0.40.0", default-features = false, features = ["tree-sitter"] }
ignore.workspace = true
pdf-inspector = { version = "=1.25.2", default-features = false }
